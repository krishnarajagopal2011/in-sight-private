<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>in sight · Life</title>
  <link rel="stylesheet" href="/static/css/kiosk.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f1217" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="in sight" />
  <link rel="apple-touch-icon" href="/static/icon-192.png" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="app">
    <header class="bar">
      <h1>Right now <span class="sub">· in sight</span><span id="dot" class="status-dot"></span></h1>
      <div class="bar-right">
        <!-- Constant balance readout as a count of notes. Tap = spend one note. -->
        <button class="balance-chip" id="balance" type="button" style="display:none" title="Tap to spend one note (set it in Settings)"></button>
        <div class="clock">
          <div class="time" id="time">--:--</div>
          <div class="date" id="date">—</div>
        </div>
        <!-- Settings gear (top-right corner) -->
        <a class="gear" href="/settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </a>
      </div>
    </header>

    <!-- Standing remission progress + safety (always visible). -->
    <div id="health-strip"></div>

    <!-- Only panels relevant in the next ~2 hours are rendered here, live. -->
    <div class="life-flow" id="flow"></div>

    <!-- Pinned bottom-right "pick anything" list — inside #app so it anchors to the
         page bottom-right and scrolls with content (desktop/kiosk only). -->
    <aside id="daymenu" class="daymenu"></aside>
  </div>

  <!-- Phone-only bottom nav (hidden on the wide kiosk) -->
  <nav class="phone-nav">
    <a href="/life" data-path="/life">Right now</a>
    <a href="/projects" data-path="/projects">Projects</a>
  </nav>

  <script type="module" src="/static/js/life.js"></script>
</body>
</html>
